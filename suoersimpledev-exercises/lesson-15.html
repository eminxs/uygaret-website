<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
    height: 3000px;
      
    }

    .grey {
      width: 200px;
      height: 100px;
      margin-left: 30px;
      margin-top: 50px;
      background-color: grey;
      position: relative;
      left: -15;
      top: -15;
    }
    .close {      
      background-color: black;
      color: white;
      position: absolute;
      left: -15px;
      top: -15px;
      font-family: arial;  
      font-size: 20px;   
      height: 45px;
      width: 45px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .time {
      position: absolute;
      background-color: black;
      color: white;
      right: 10px;
      bottom: 10px;      
      width: 40px;      
    }  
    .askim {
      position: relative;
      display: inline-block;
    }
    .princess {
      width: 250px;
      height: 300px;
      object-fit: cover;
    
    }
    .my-hearth {
      position: absolute;
      right: 0px;
      top: 10px;
      background-color: black;
      color: white;
      font-family: arial;
      padding: 8 12 8 12 ;
    }
    .bottom-overlay {
      position: absolute;
      bottom: 0px;
      left: 0px;
      right: 0px;
      height: 100px;
      background-color: rgba(255, 255, 255,0.8 );
      display: flex;
      align-items: center;
      justify-content: center;

    }
    .add-to-cart-button {
     background-color: white;
     border-width: 1px;
     border-style: solid;
     border-color: black;
     padding: 10 15 10 15;
    }

    
  </style>
</head>
<body>
  


  <div class="grey">
    <div class="time">22:50</div>
    <div class="close">X</div>
  </div>

  <div class="askim">
    <img class="princess" src="ayla.jpeg" alt="">
    <div class="my-hearth">My hearth</div>
    <div class="bottom-overlay">
      <button class="add-to-cart-button">
        Add to cart</button>
    </div>
  </div>
  
</body>
</html>
