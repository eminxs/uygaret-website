<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson-7</title>
  <style>
    html{
      font-family: arial;
    }
    .Searchbar {
      display: block;
      height: 36px;
      width: 220px;
      border-style: solild;
      border-color: rgb(183, 176, 176);
      border-width: 0.5px;
      padding-left: 10px;
      border-radius: 5px; 
      margin-bottom: 20px; 
      border-color: rgb(203, 196, 196);  
      
    }
    ::placeholder {
      color: grey;
      opacity: 0.5;
      font-weight: bold;
    }
    .google-searchbar {
      width: 300px;
      height: 36px;
      border: none;
      box-shadow: 1px 1px 1px 1px rgba(0, 0, 0, 0.1);
      border-radius: 18px;
      padding-left: 10px;    
       
    }    
    .email {
      color:  grey;
      font-weight: bold;

    }
    .input-1 {
      width: 425px;
      height: 36px;
      border-style: solid;
      border-color: rgb(161, 152, 152);
    }
    .consent-text {
      font-weight:bold;
      color: rgb(188, 179, 179);
    }
    .Add-to-join {
      width: 425px;
      height: 40px;
      background-color: blue;
      color: white;
      border-radius: 30px;
      border: none;
      font-weight: bold;
      font-size: 18;
       display: block;
    }
    .ayla {
      width: 100px;
      height: 100px;
      object-fit: cover;     
      margin-top: 20px;
      border-radius: 100px;
      vertical-align: middle;
      
    }
    .question {
      color: grey; 
      vertical-align: middle;    
      display: inline-block;
      margin-left: 15px;
    
    }
    .tweet {
      display: inline-block;
      vertical-align: middle;
      margin-left: 100px;
      background-color: rgb(53, 53, 236);
      color: white;
      border: none;
      padding: 5 9 5 9;
      
      border-radius: 22px;
      font-weight: bold;
    }



  </style>
</head>
<body>
  <input class="searchbar" placeholder ="Search"  type="text">

  <input class="google-searchbar" type="text" placeholder="Search Google or type URL">

  <p class="email">Email</p>
  <input class="input-1" type="text">
  <p  class="consent-text" >By clickin Agree to join, you agree to the Privacy Policy</p>
  <button class="Add-to-join">Agree & Join</button>

  <img class="ayla" src="/ayla.jpeg" alt="">
  <p class="question">What's happening? </p>
  <button class="tweet">Tweet</button>
  

  
</body>
</html>
